apiVersion: v1
kind: Pod

metadata:
  name: startup-pod

spec:
  containers:
  - name: app
    image: busybox

    command:
    - sh
    - -c
    - |
      sleep 30
      touch /tmp/started
      sleep 3600

    startupProbe:
      exec:
        command:
        - cat
        - /tmp/started
      periodSeconds: 5
      failureThreshold: 10
