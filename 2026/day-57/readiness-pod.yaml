apiVersion: v1
kind: Pod

metadata:
  name: readiness-pod

spec:
  containers:
  - name: app
    image: busybox

    command:
    - sh
    - -c
    - |
      sleep 20
      touch /tmp/ready
      sleep 3600

    readinessProbe:
      exec:
        command:
        - cat
        - /tmp/ready
      periodSeconds: 5
