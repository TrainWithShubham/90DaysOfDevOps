name: smart pipeline

on:
  push:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: print job name
        run: echo "job is lint"

  test:
    runs-on: ubuntu-latest

    steps:
      - name: print job name
        run: echo "job is test"

  summury:
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - name: Print to Job Summary
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          COMMIT_MSG="${{ github.event.head_commit.message }}"
      




    
  
