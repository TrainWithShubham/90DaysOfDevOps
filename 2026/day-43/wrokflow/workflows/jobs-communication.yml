name: share data between jobs

on:
  workflow_dispatch:

jobs:
  crate-output:
    runs-on: ubuntu-latest

    outputs:
      today: ${{ steps.generate-date.outputs.current_date }}

    steps:
      - name: Generate and save date
        id: generate-date
        run: echo "current_date=$(date +'%Y-%m-%d_%H-%M-%S')" >> "$GITHUB_OUTPUT"

  job-2:
    runs-on: ubuntu-latest
    needs: crate-output

    steps:
      - name: Use the passed date
        run: 'echo "The date is passed: ${{ needs.crate-output.outputs.today }}"'


                 
