name: matrix os

on:
  workflow_dispatch:

jobs:
  matrix-os:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

        exclude:
          - os: windows-latest
            python-version: "3.10"

    runs-on: ${{ matrix.os }}

    steps:
      - name: install pythone ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: fail python 3.11
        if: matrix.python-version == '3.11'
        run: exit 1

      - name: print python version
        run: python --version

      - name: show os name
        run: echo $RUNNER_OS