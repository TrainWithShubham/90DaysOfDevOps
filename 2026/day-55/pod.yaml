apiVersion: v1
kind: Pod
metadata:
  name: emptydir-pod

spec:
  containers:
  - name: app
    image: busybox
    command:
    - sh
    - -c
    - sleep 3600

    volumeMounts:
    - name: data-volume
      mountPath: /data

  volumes:
  - name: data-volume
    persistentVolumeClaim: 
      claimName: my-pvc
