apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend-deployment

spec:
  replicas: 3

  selector:
    matchLabels:
      app: backend

  template:          # ← Same indentation as selector
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend
          image: nginx:latest
          ports:
            - containerPort: 80

