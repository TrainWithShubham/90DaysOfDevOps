name: trivy scanning
on:
  workflow_dispatch:

jobs:
  trivy-scan:
          runs-on: ubuntu-latest
          steps:
          - name: Checkout code
            uses: actions/checkout@v4

          - name: create a short SHA variable
            id: vars
            run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
   
          - name: Set up Docker Buildx
            uses: docker/setup-buildx-action@v2
   
          - name: Log in to Docker Hub
            uses: docker/login-action@v3
            with:
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}
   
          - name: Build and push Docker image
            uses: docker/build-push-action@v6
            with:
                context: ./app
                push: false
                tags: |
                 chaitanya057/devops-health-api:latest
   
          - name: Run Trivy vulnerability scanner
            uses: aquasecurity/trivy-action@v0.36.0
            with:
               image-ref: chaitanya057/devops-health-api:sha-${{ steps.vars.outputs.sha_short }}
               format: 'json'
               output: 'trivy-report.json'
               exit-code: '1'
               severity: 'CRITICAL'
               vuln-type: 'os,library'
               ignore-unfixed: false

          - name: Upload Trivy report
            uses: actions/upload-artifact@v4
            if: always()
            with:
               name: trivy-scan-report
               path: trivy-report.json

          - name: push the image to dockerhub
            if: success()
            uses: docker/build-push-action@v6
            with:
                context: ./app
                push: true
                tags: |
                 chaitanya057/devops-health-api:latest
                 chaitanya057/devops-health-api:sha-${{ steps.vars.outputs.sha_short }}