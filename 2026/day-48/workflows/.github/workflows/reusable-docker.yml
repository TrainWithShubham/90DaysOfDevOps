name: reusable-docker-build


on:
  workflow_call:
    inputs:
      image_name:
        description: Name of the Docker image to build
        required: true
        type: string

    secrets:
      docker_username:
        required: true
      docker_token:
        required: true

    outputs:
      image_url:
        description: URL of the built Docker image
        value: ${{ jobs.build-and-push.outputs.image_url }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    outputs:
      image_url: ${{ steps.image.outputs.image_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate Short SHA
        id: vars
        run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"


      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.docker_username }}
          password: ${{ secrets.docker_token }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            ${{ inputs.image_name }}:latest
            ${{ inputs.image_name }}:sha-${{ steps.vars.outputs.sha_short }}
             

      - name: Set image URL
        id: image
        run: |
          echo "image_url=${{ inputs.image_name }}:sha-${{ steps.vars.outputs.sha_short }}" >> "$GITHUB_OUTPUT"


            

