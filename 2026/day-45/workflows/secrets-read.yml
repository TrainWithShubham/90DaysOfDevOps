name: secrets reads

on:
  workflow_dispatch:

jobs:
  upload-artifacts:
    runs-on: ubuntu-latest

    steps:
      - name: check does secret set
        env:
          MY_SECRET: ${{ secrets.MY_SECRET_MESSAGE }}
        run: |
          if [ -n "$MY_SECRET" ]; then
              echo "The secret is set: true"
          else
              echo "The secret is set: false"
          fi

      - name: create file
        run: |
          echo "hello this is file generated" > output.txt

      - name: Upload the file as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: shred-text-artifact
          path: output.txt

      - name: Print GitHub Context
        run: |
          echo "=== GitHub Context ==="
          echo "${{ toJSON(github) }}"


  download-artifact:
    needs: upload-artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: shred-text-artifact
          path: downloaded-output

      - name: Verify downloaded
        run: |
          cat downloaded-output/output.txt

      - name: Print GitHub Context
        run: |
          echo "=== GitHub Context ==="
          echo "${{ toJSON(github) }}"






              

              