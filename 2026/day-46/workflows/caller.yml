name: caller-workflow

on:
  push:
    branches: [main] 


jobs:
  caller-shared-logic:
    name: calling the reusable
    uses: ./.github/workflows/reusable.yml
    with:
      app_name: github-action-practice
      environment: 'production'
    secrets:
      API_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  version-print:
    needs: caller-shared-logic
    runs-on: ubuntu-latest


    
    steps:
      - name: print build version with built sha
        run: |
          echo "The version passed from the reusable workflow is: ${{ needs.caller-shared-logic.outputs.version }}"