<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DevOps Nginx Server</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 90%;
            max-width: 850px;
            text-align: center;
        }

        .card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 55px 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        .logo {
            font-size: 55px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        .highlight {
            color: #38bdf8;
        }

        .description {
            color: #cbd5e1;
            font-size: 18px;
            line-height: 1.7;
            margin-bottom: 35px;
        }

        .status {
            display: inline-block;
            background: #064e3b;
            color: #6ee7b7;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: bold;
            margin-bottom: 35px;
        }

        .info {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .box {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 20px 30px;
            min-width: 180px;
        }

        .box h3 {
            color: #38bdf8;
            margin-bottom: 8px;
        }

        .box p {
            color: #cbd5e1;
        }

        footer {
            margin-top: 30px;
            color: #94a3b8;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="card">

            <div class="logo">🚀</div>

            <h1>
                DevOps <span class="highlight">Nginx Server</span>
            </h1>

            <p class="description">
                Welcome to my Dockerized web application.
                This website is running inside an Nginx Docker container.
            </p>

            <div class="status">
                ● Server is Running
            </div>

            <div class="info">

                <div class="box">
                    <h3>Web Server</h3>
                    <p>Nginx</p>
                </div>

                <div class="box">
                    <h3>Container</h3>
                    <p>Docker</p>
                </div>

                <div class="box">
                    <h3>Environment</h3>
                    <p>DevOps Lab</p>
                </div>

            </div>

            <footer>
                Built and deployed with Docker & Nginx
            </footer>

        </div>

    </div>

</body>
</html>
