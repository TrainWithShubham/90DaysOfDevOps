name: Day 44 - Artifact Between Jobs

on:
  push:
    branches:
      - DevOps-practice

  workflow_dispatch:

jobs:
  generate-file:
    runs-on: ubuntu-latest

    steps:
      - name: Create artifact file
        run: |
          mkdir output
          echo "This file came from Job 1" > output/message.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: job-message
          path: output/message.txt

  use-file:
    runs-on: ubuntu-latest
    needs: generate-file

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: job-message
          path: downloaded

      - name: Print artifact contents
        run: cat downloaded/message.txt
