name: Smart Pipeline

on: push

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Run lint
        run: echo "Linting the code"

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Run tests
        run: echo "Running tests"

  summary:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Print branch type
        if: github.ref == 'refs/heads/DevOps-practice'
        run: echo "This is a push to the main working branch"

      - name: Print feature branch message
        if: github.ref != 'refs/heads/DevOps-practice'
        run: echo "This is a push to a feature branch"

      - name: Print commit message
        run: echo "Commit message is ${{ github.event.head_commit.message }}"
